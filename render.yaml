services:
  - type: web
    name: ai-document-analyzer
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab'); nltk.download('stopwords')"
    startCommand: gunicorn --chdir backend app:app --timeout 120 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
